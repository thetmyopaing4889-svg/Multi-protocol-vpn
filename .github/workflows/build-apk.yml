name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go 1.22 (For Sing-box / Xray compilation)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          npm install
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Application
        run: |
          npm run build

      - name: Generate Fresh Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Aegis Native VpnService & Multi-Protocol Bridge
        run: |
          TARGET_DIR="android/app/src/main/java/com/aegis/vpn"
          mkdir -p "$TARGET_DIR"
          cp android-native/AegisVpnService.java "$TARGET_DIR/"
          cp android-native/AegisVpnPlugin.java "$TARGET_DIR/"
          cp android-native/MainActivity.java "$TARGET_DIR/"

          # Inject VpnService permission and service declaration into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Add BIND_VPN_SERVICE and FOREGROUND_SERVICE permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

          # Add AegisVpnService inside <application> tag
          VPN_SERVICE_XML='        <service android:name=".AegisVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false" android:foregroundServiceType="specialUse">\n            <intent-filter>\n                <action android:name="android.net.VpnService" />\n            </intent-filter>\n        </service>'
          sed -i "/<\/application>/i \\$VPN_SERVICE_XML" "$MANIFEST"

      - name: Bundle Multi-Core Binaries (Xray & Sing-box Native Stack)
        run: |
          # Create jniLibs directory for arm64-v8a (Standard modern Android devices)
          JNI_DIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"

          # Download and install sing-box universal censorship-bypass core (Supporting VLESS, HY2, AWG, TUIC, NAIVE)
          echo "Fetching latest hardened sing-box core for Android arm64..."
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.9.7/sing-box-1.9.7-android-arm64.tar.gz -o /tmp/sing-box.tar.gz || true
          if [ -f /tmp/sing-box.tar.gz ]; then
            tar -xzf /tmp/sing-box.tar.gz -C /tmp/ || true
            find /tmp/ -name "sing-box" -exec cp {} "$JNI_DIR/libsingbox.so" \; || true
          fi

          # Fix Kotlin duplicate class error in build.gradle
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.9.22")
                      }
                  }
              }
          }
          EOF

          # Gradle flags
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
